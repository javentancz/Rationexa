name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is difficult today? Avoid starting with a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible, and for whom?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Human-review and privacy boundary
      description: Explain how the proposal preserves explicit human judgment and workspace isolation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler workflow or existing capability did you try?
