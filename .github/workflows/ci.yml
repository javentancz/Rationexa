name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:////tmp/rationexa-ci.db
      ARTIFACT_DIR: /tmp/rationexa-artifacts
      AI_PROVIDER: deterministic
      PASSWORD_RESET_DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e 'services/api[dev]'
      - name: Validate application (Vitest, API, build, and Playwright)
        run: pnpm validate

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: rationexa_ci
          POSTGRES_USER: rationexa
          POSTGRES_PASSWORD: rationexa-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rationexa -d rationexa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rationexa:rationexa-ci-password@localhost:5432/rationexa_ci
      ARTIFACT_DIR: /tmp/rationexa-postgres-artifacts
      AI_PROVIDER: deterministic
      PASSWORD_RESET_DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e 'services/api[dev]'
      - name: Validate PostgreSQL runtime
        run: bash scripts/validate-postgres.sh
