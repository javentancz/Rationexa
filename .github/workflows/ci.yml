name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:////tmp/rationexa-ci.db
      ARTIFACT_DIR: /tmp/rationexa-artifacts
      AI_PROVIDER: deterministic
      PASSWORD_RESET_DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e 'services/api[dev]'
      - run: pnpm check
      - run: pnpm --filter @rationexa/web build
      - run: ruff check services/api/src services/api/tests
      - run: pytest services/api/tests
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @rationexa/web exec playwright install --with-deps chromium
      - run: pnpm --filter @rationexa/web test:e2e
