services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rationexa
      POSTGRES_USER: rationexa
      POSTGRES_PASSWORD: rationexa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rationexa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rationexa_postgres:/var/lib/postgresql/data

volumes:
  rationexa_postgres:
