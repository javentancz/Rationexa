services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rationexa
      POSTGRES_USER: rationexa
      POSTGRES_PASSWORD: rationexa
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rationexa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rationexa_postgres18:/var/lib/postgresql

volumes:
  rationexa_postgres18:
