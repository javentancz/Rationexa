[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "rationexa-api"
version = "0.2.0"
description = "Rationexa human-in-the-loop decision memory and review API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.19.1,<2",
  "cryptography>=50.0.1,<51",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "openai>=3.3.1,<4",
  "pydantic-settings>=2.15.0,<3",
  "python-multipart>=0.0.32,<1",
  "sqlalchemy>=2.0.52,<3",
  "psycopg[binary]>=3.3.4,<4",
  "pypdf>=6.16.2,<7",
  "fpdf2>=2.8.8,<3",
  "uvicorn[standard]>=0.52.4,<1"
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.4,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/rationexa_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"src/rationexa_api/pilot_backup.py" = ["S603", "S607"]
"src/rationexa_api/share_service.py" = ["S105"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["%(here)s/src"]
