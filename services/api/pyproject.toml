[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rationexa-api"
version = "0.1.0"
description = "Rationexa Stage 1 decision review API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=1.100,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5.9,<7",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/rationexa_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
